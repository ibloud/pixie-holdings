<!DOCTYPE html>
<html data-holdings-surface="radar" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIXIE OS — First Five Minutes</title>


<link rel="canonical" href="https://holdings.loptrlab.com/radar.html">
<meta name="description" content="PIXIE OS — first five minutes stewardship demo from Loptr Lab.">
<meta property="og:title" content="PIXIE OS — First Five Minutes">
<meta property="og:description" content="PIXIE OS — first five minutes stewardship demo from Loptr Lab.">
<meta property="og:url" content="https://holdings.loptrlab.com/radar.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PIXIE OS · Loptr Lab">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="PIXIE OS — First Five Minutes">
<meta name="twitter:description" content="PIXIE OS — first five minutes stewardship demo from Loptr Lab.">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebPage", "name": "PIXIE OS — First Five Minutes", "url": "https://holdings.loptrlab.com/radar.html", "description": "PIXIE OS — first five minutes stewardship demo from Loptr Lab."}</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<iframe id="pixie-core" src="radar-core.html?shell=1" title="PIXIE OS Desktop"></iframe>
<script>
const frame=document.getElementById('pixie-core');
const DEMO_KEY='pixie-first-five-v1';
const params=new URLSearchParams(location.search);
// The participant card lives in the canonical core route, outside the seeded demo.
if(params.get('role')==='participant') frame.src='radar-core.html'+location.search;

function bootDesktop(){
  if(params.get('role')==='participant') return;
  try{
    const doc=frame.contentDocument;
    const win=frame.contentWindow;
    if(!doc || doc.getElementById('pixie-demo-mounted')) return;

    const marker=doc.createElement('meta');
    marker.id='pixie-demo-mounted';
    doc.head.appendChild(marker);

    doc.documentElement.dataset.holdingsDemo='true';

    const banner=doc.createElement('div');
    banner.className='seed-banner';
    banner.innerHTML='<strong>PIXIE OS // FIRST FIVE MINUTES</strong><br>Seeded public demo · no live mailbox or file-system access<br>Persona data is fictional and modeled on real stewardship problems.';
    doc.body.appendChild(banner);

    const icons=doc.querySelector('.icon-grid');
    const trainingIcon=icons?.querySelector('[aria-label="Open Onboarding — Find Your Path"]');
    if(icons) icons.innerHTML='';

    const addIcon=(label,emoji,aria,openFn)=>{
      const el=doc.createElement('div');
      el.className='desk-icon'; el.setAttribute('role','button'); el.tabIndex=0; el.setAttribute('aria-label',aria);
      el.innerHTML='<div class="icon-face hs-static-2">'+emoji+'</div><div class="icon-label">'+label+'</div>';
      el.addEventListener('click',openFn);
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openFn()}});
      icons?.appendChild(el);
    };

    const addWindow=(id,title,body)=>{
      const w=doc.createElement('div');
      w.className='window w-mint demo-window'; w.id=id; w.style.display='none';
      w.setAttribute('role','dialog'); w.setAttribute('aria-label',title);
      w.innerHTML='<div class="win-bar"><div class="win-dots"><div class="wdot wd-close"></div><div class="wdot wd-min"></div><div class="wdot wd-max"></div></div><div class="win-title">'+title+'</div></div><div class="win-body">'+body+'</div>';
      doc.querySelector('.taskbar')?.before(w);
      win.wireWindow?.(id);
      return w;
    };

    const intake=addWindow('win-intake','PIXIE // INTAKE',`
      <div class="demo-kicker">SEEDED PERSONA · CREATOR WORKSPACE</div>
      <h1 class="demo-title">I found something you may want to keep.</h1>
      <p class="demo-copy">This persona's mess is modeled on real creator workflows. The file below is seeded demo data. PIXIE will not change anything until permission is given.</p>
      <div class="status-row"><span class="status-chip proto">PROTOTYPE</span><span class="status-chip">SEEDED DATA</span><span class="status-chip plan">NO LIVE FILE ACCESS</span></div>
      <div id="demo-stage"></div>
    `);

    const projects=addWindow('win-projects','PIXIE // PROJECTS',`
      <div class="demo-kicker">PROJECT CONTEXT</div>
      <h1 class="demo-title">Two active projects. One source of truth each.</h1>
      <div class="state-card"><div class="state-label">PROJECT 01</div><strong>PIXIE Device Stewardship</strong><p class="demo-copy">Artist File Protocol · consent loop · provenance receipts.</p><div class="status-row"><span class="status-chip">TESTED: UI SHELL</span><span class="status-chip proto">PROTOTYPE: FILE ACTIONS</span></div></div>
      <div class="state-card"><div class="state-label">PROJECT 02</div><strong>Made Sick</strong><p class="demo-copy">Community experience connected through PIXIE, not duplicated inside the desktop.</p><div class="demo-actions"><button class="demo-btn secondary" id="open-made-sick">Open Made Sick</button></div></div>
    `);

    const receipts=addWindow('win-receipts','PIXIE // RECEIPTS',`
      <div class="demo-kicker">PROVENANCE</div>
      <h1 class="demo-title">The receipt is the trust signal.</h1>
      <p class="demo-copy">Every consequential action should leave a human-readable record of what was observed, what PIXIE inferred, what was proposed, what you approved, and what changed.</p>
      <div id="receipt-status" class="state-card" role="status" aria-live="polite"></div>
    `);

    const how=addWindow('win-how','PIXIE // HOW THIS WORKS',`
      <div class="demo-kicker">BUILDER DOOR</div>
      <h1 class="demo-title">One stewardship grammar. Multiple adapters.</h1>
      <div class="state-card"><div class="state-label">INTENT RECORD</div><strong>Observed → Inferred → Proposed → Permission → Action → Receipt</strong><p class="demo-copy">The receipt is the user-facing view of PIXIE's provenance chain.</p></div>
      <div class="state-card"><div class="state-label">ADAPTERS</div><strong>Files · Mail · GitHub · AT Protocol · future device surfaces</strong><p class="demo-copy">Adapters change. The consent and provenance grammar does not.</p></div>
      <div class="status-row"><span class="status-chip">TESTED</span><span class="status-chip proto">PROTOTYPE</span><span class="status-chip plan">PLANNED</span></div>
      <p class="demo-copy"><strong>TESTED</strong> means exercised against its intended system. <strong>PROTOTYPE</strong> means the interaction is demonstrated but may be simulated. <strong>PLANNED</strong> means design intent only.</p>
    `);

    const creatorControl=addWindow('win-creator-control','PIXIE // CREATOR CONTROL ROOM',
      '<a href="https://ibloud.github.io/pixie-creator-os/?from=superme" target="_blank" rel="noopener noreferrer" class="hs-static-3">Open full Creator OS ↗</a><iframe src="https://ibloud.github.io/pixie-creator-os/?from=superme" title="PIXIE Creator OS Control Room" class="hs-static-4" loading="lazy"></iframe>');
    creatorControl.classList.add('creator-panel');
    const radarControl=addWindow('win-control','PIXIE // RADAR CONTROL ROOM',
      '<iframe src="control-room.html" title="PIXIE interactive radar" loading="lazy"></iframe>');
    radarControl.classList.add('radar-panel');

    addIcon('PIXIE','✦','Open PIXIE Creator Control Room',()=>win.openWin?.('creator-control'));
    addIcon('Intake','↓','Open Intake',()=>win.openWin?.('intake'));
    addIcon('Projects','▣','Open Projects',()=>win.openWin?.('projects'));
    addIcon('Receipts','✓','Open Receipts',()=>win.openWin?.('receipts'));
    addIcon('Radar','◉','Open interactive radar',()=>win.openWin?.('control'));
    if(trainingIcon){
      trainingIcon.querySelector('.icon-label').textContent='Training';
      icons.appendChild(trainingIcon);
    }

    if(params.get('tool')==='care'){
      addWindow('win-care','PIXIE // MADE SICK CARE',
        '<iframe src="https://made-sick.org/pixie-care.html" title="Made Sick care workspace" class="hs-static-5"></iframe>');
    }

    projects.querySelector('#open-made-sick')?.addEventListener('click',()=>window.open('https://made-sick.org/','_blank','noopener,noreferrer'));

    const taskbar=doc.querySelector('.taskbar');
    const reset=doc.createElement('button');
    reset.className='tb-btn t-mint'; reset.textContent='Reset demo'; reset.id='tb-reset-demo';
    reset.addEventListener('click',()=>{localStorage.removeItem(DEMO_KEY); localStorage.removeItem(DEMO_KEY+'-name'); copyName='pixie-origin-demo.mp4'; renderStage(0); win.openWin?.('intake')});
    taskbar?.querySelector('.tb-right')?.before(reset);

    const howBtn=doc.createElement('button');
    howBtn.className='tb-btn t-lav'; howBtn.textContent='How this works'; howBtn.id='tb-how';
    howBtn.addEventListener('click',()=>win.openWin?.('how'));
    taskbar?.querySelector('.tb-right')?.before(howBtn);

    const originalName='pixie-origin-demo.mp4';
    let copyName=localStorage.getItem(DEMO_KEY+'-name')||originalName;
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function saveStage(n){localStorage.setItem(DEMO_KEY,String(n))}
    function updateReceipt(stage){
      const status=receipts.querySelector('#receipt-status');
      if(stage===3 || stage===4) status.innerHTML='<div class="state-label">PROTOTYPE RECEIPT</div><h3>Original unchanged.</h3><p>Working-copy record: <strong>'+escape(copyName)+'</strong></p><p>Explicit approval recorded. No live file mutation.</p>';
      else if(stage===5) status.innerHTML='<div class="state-label">UNDO RECORDED</div><h3>Simulated working copy undone.</h3><p>Original unchanged. No live file mutation.</p>';
      else status.innerHTML='<div class="state-label">NO ACTION YET</div><p>Approval and a simulated action are required before a receipt is created.</p>';
    }
    function renderStage(stage){
      saveStage(stage);
      updateReceipt(stage);
      const host=intake.querySelector('#demo-stage');
      if(!host) return;
      if(stage===0){
        host.innerHTML=`
          <div class="state-card"><div class="state-label">OBSERVED</div><strong>1789223454414_instaPV.mp4</strong><p class="demo-copy">Found in Downloads. No project assignment is stored.</p><div class="state-meta">Observed fact · filename and location only</div></div>
          <div class="demo-actions"><button class="demo-btn" id="next-infer">Ask PIXIE what it thinks</button></div>`;
        host.querySelector('#next-infer')?.addEventListener('click',()=>renderStage(1));
      }else if(stage===1){
        host.innerHTML=`
          <div class="state-card"><div class="state-label">OBSERVED</div><strong>1789223454414_instaPV.mp4</strong><div class="state-meta">Found in Downloads · no project assignment</div></div>
          <div class="state-card"><div class="state-label">INFERRED</div><strong>Likely related to the PIXIE project.</strong><p class="demo-copy">Reason: the clip was created during the same session as two PIXIE reference files.</p><div class="state-meta">Confidence: 82% · expires after this demo session</div><div class="demo-actions"><button class="demo-btn secondary" id="see-proposal">See proposal</button><button class="demo-btn ghost" id="dismiss-inference">Dismiss</button></div></div>`;
        host.querySelector('#see-proposal')?.addEventListener('click',()=>renderStage(2));
        host.querySelector('#dismiss-inference')?.addEventListener('click',()=>renderStage(0));
      }else if(stage===2){
        host.innerHTML=`
          <div class="state-card"><div class="state-label">PROPOSED</div><strong>Create a working copy. Preserve the source exactly as found.</strong>
          <div class="diff"><div><strong>BEFORE</strong><br>1789223454414_instaPV.mp4<br><span class="state-meta">Source stays here</span></div><div><strong>AFTER</strong><br><span id="copy-name"></span><br><span class="state-meta">New working copy in PIXIE project</span></div></div>
          <p class="demo-copy">Also proposed: transcript + private re-entry note. Nothing has changed.</p></div>
          <div class="state-card"><div class="state-label">PERMISSION</div><strong>I can prepare the change. You decide whether it happens.</strong><p class="demo-copy">PIXIE waits because reversible actions require explicit approval; irreversible actions are prepared and handed back to you.</p>
          <div class="demo-actions"><button class="demo-btn" id="approve-action">Approve working copy</button><button class="demo-btn secondary" id="edit-action">Edit proposal</button><button class="demo-btn ghost" id="not-now">Not now</button></div></div>`;
        host.querySelector('#copy-name').textContent=copyName;
        host.querySelector('#approve-action')?.addEventListener('click',()=>renderStage(3));
        host.querySelector('#edit-action')?.addEventListener('click',()=>renderStage(6));
        host.querySelector('#not-now')?.addEventListener('click',()=>renderStage(0));
      }else if(stage===3){
        host.innerHTML=`
          <div class="state-card"><div class="state-label">ACTION</div><strong>Prototype action completed.</strong><p class="demo-copy">In this seeded demo, no real file system was touched. The simulated action creates a working-copy record only.</p></div>
          <div class="receipt"><div class="state-label">RECEIPT</div><h3>Original unchanged.</h3><div class="trust-line">Working-copy record prepared · approval recorded · undo available</div><div class="state-meta">Prototype data · no live file mutation</div>
          <div class="demo-actions"><button class="demo-btn secondary" id="undo-demo">Undo</button><button class="demo-btn" id="show-mail">Continue</button></div></div>`;
        host.querySelector('#undo-demo')?.addEventListener('click',()=>renderStage(5));
        host.querySelector('#show-mail')?.addEventListener('click',()=>renderStage(4));
      }else if(stage===5){
        host.innerHTML='<div class="receipt"><div class="state-label">UNDO RECORDED</div><h3>Simulated working copy undone.</h3><p>Original unchanged. No live file mutation.</p></div><div class="demo-actions"><button class="demo-btn" id="try-again">Review proposal again</button></div>';
        host.querySelector('#try-again')?.addEventListener('click',()=>renderStage(2));
      }else if(stage===6){
        host.innerHTML='<div class="state-card"><div class="state-label">EDIT PROPOSAL</div><label for="edit-copy-name">Working-copy filename</label><input id="edit-copy-name" type="text" maxlength="100" required pattern="[a-zA-Z0-9][a-zA-Z0-9._-]*\\.mp4" class="hs-static-6"><p class="demo-copy">The original file remains untouched. Save to review the revised proposal before approval.</p><div class="demo-actions"><button class="demo-btn" id="save-edit">Save proposal</button><button class="demo-btn ghost" id="cancel-edit">Cancel</button></div></div>';
        const input=host.querySelector('#edit-copy-name'); input.value=copyName;
        host.querySelector('#save-edit')?.addEventListener('click',()=>{if(!input.reportValidity())return;copyName=input.value;localStorage.setItem(DEMO_KEY+'-name',copyName);renderStage(2)});
        host.querySelector('#cancel-edit')?.addEventListener('click',()=>renderStage(2));
      }else{
        host.innerHTML=`
          <div class="mail-catch"><div class="state-label">SECOND DOMAIN · MAIL</div><h2 class="hs-static-7">Deadline caught before it was missed.</h2><p class="demo-copy"><strong>From:</strong> housing@example.com · <strong>Due:</strong> tomorrow at 5:00 PM</p><p class="demo-copy"><strong>Why PIXIE surfaced it:</strong> explicit deadline language + housing record context.</p><div class="state-meta">Confidence: 94% · seeded message · no live mailbox access</div></div>
          <div class="state-card"><div class="state-label">PROPOSED</div><strong>Draft a reply for review.</strong><p class="demo-copy">PIXIE prepared the text. There is no send action in this demo.</p></div>
          <div class="receipt"><div class="state-label">RECEIPT</div><h3>Draft prepared. Not sent.</h3><div class="trust-line">Sending is yours.</div><div class="state-meta">Prototype · seeded mail · no external action</div></div>
          <div class="how-door"><button class="demo-btn" id="open-how">How this works</button></div>`;
        host.querySelector('#open-how')?.addEventListener('click',()=>win.openWin?.('how'));
      }
    }

    // The core shell opens its legacy ecosystem window by default; start this desktop clean.
    doc.querySelectorAll('.window:not(.demo-window)').forEach(w=>win.closeWin?.(w.id));
    const saved=Number(localStorage.getItem(DEMO_KEY)||0);
    renderStage(Number.isInteger(saved)&&saved>=0&&saved<=6?saved:0);
    win.openWin?.(params.get('tool')==='care'?'care':params.get('role')==='admin'?'control':'intake');
  }catch(error){console.error('[PIXIE OS] First-five demo boot failed:',error)}
}

frame.addEventListener('load',bootDesktop);
window.addEventListener('message',e=>{
  if(e.origin!==location.origin || e.data?.type!=='pixie:focus-window') return;
  const name=e.data.name;
  if(['intake','projects','receipts','how','creator-control','control','care'].includes(name)) frame.contentWindow.openWin?.(name);
});
if(frame.contentDocument && frame.contentDocument.readyState!=='loading') bootDesktop();
</script>
</body>
</html>
