<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LOPTR LABS // RADAR SITEMAP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #030712; color: #00ff66; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .radar-frame { position: relative; width: 700px; height: 700px; border: 1px solid rgba(0, 255, 102, 0.3); border-radius: 50%; background: radial-gradient(circle, #06121e 0%, #020617 100%); box-shadow: inset 0 0 50px #000, 0 0 30px rgba(0, 255, 102, 0.1); }
    .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px dashed rgba(0, 255, 102, 0.15); border-radius: 50%; pointer-events: none; }
    .ring-1 { width: 25%; height: 25%; }
    .ring-2 { width: 50%; height: 50%; }
    .ring-3 { width: 75%; height: 75%; }
    .crosshair-v { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(0,255,102,0.1); pointer-events: none; }
    .crosshair-h { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(0,255,102,0.1); pointer-events: none; }
    .sweep { position: absolute; width: 50%; height: 50%; top: 0; left: 50%; transform-origin: bottom left; background: conic-gradient(from 180deg at 0% 100%, rgba(0, 255, 102, 0.2) 0deg, transparent 60deg); animation: rotate 6s linear infinite; pointer-events: none; border-bottom: 1px solid #00ff66; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .blip { position: absolute; width: 8px; height: 8px; background: #00ff66; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 10px #00ff66; }
    .blip:hover { background: #fff; box-shadow: 0 0 15px #fff; z-index: 10; }
    .blip-label { position: absolute; left: 12px; top: -4px; font-size: 11px; color: #a7f3d0; opacity: 0.7; pointer-events: none; white-space: nowrap; text-shadow: 0 0 4px #000; }
    .center-node { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: #ff0055; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 12px #ff0055; }
  </style>
</head>
<body>
  <div class="radar-frame" id="radar">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="crosshair-v"></div>
    <div class="crosshair-h"></div>
    <div class="sweep"></div>
    <div class="center-node" title="Gaia Core Anchor"></div>
  </div>

  <script>
    async function loadRadar() {
      const res = await fetch('https://api.github.com/users/ibloud/repos?per_page=100');
      const repos = await res.json();
      const container = document.getElementById('radar');
      
      repos.forEach((repo, i) => {
        const angle = (i / repos.length) * 2 * Math.PI;
        const dist = 80 + Math.random() * 220;
        const x = 350 + dist * Math.cos(angle);
        const y = 350 + dist * Math.sin(angle);
        
        const a = document.createElement('a');
        a.href = repo.html_url;
        a.target = '_blank';
        
        const blip = document.createElement('div');
        blip.className = 'blip';
        blip.style.left = `${x}px`;
        blip.style.top = `${y}px`;
        
        const label = document.createElement('span');
        label.className = 'blip-label';
        label.textContent = repo.name;
        
        blip.appendChild(label);
        a.appendChild(blip);
        container.appendChild(a);
      });
    }
    loadRadar();
  </script>
</body>
</html>
