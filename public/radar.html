<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PIXIE OS desktop — consent-first ecosystem control center from Loptr Lab.">
<title>PIXIE OS — Desktop</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#080b09;overflow:hidden}
#pixie-core{display:block;width:100%;height:100%;border:0;background:#080b09}
</style>
</head>
<body>
<iframe id="pixie-core" src="radar-core.html" title="PIXIE OS Desktop"></iframe>
<script>
const frame=document.getElementById('pixie-core');
function bootDesktop(){
  try{
    const doc=frame.contentDocument;
    if(!doc || doc.getElementById('win-control')) return;
    const style=doc.createElement('style');
    style.textContent=`
      @keyframes pixieBreathe{0%,100%{opacity:.72;box-shadow:0 0 7px rgba(183,212,138,.22)}50%{opacity:1;box-shadow:0 0 18px rgba(183,212,138,.62)}}
      .pixie-breath{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:8px;animation:pixieBreathe 3.2s ease-in-out infinite}
      .taskbar{position:fixed!important;left:0;right:0;bottom:0!important;z-index:200!important}
      #win-control{height:min(76vh,720px)}
      #win-control .win-body{padding:0;overflow:hidden;flex:1}
      #win-control iframe{display:block;width:100%;height:100%;border:0;background:#061015}
      @media(max-width:760px){#win-control{left:2vw!important;top:2vh!important;width:96vw!important;height:86vh!important}.icon-grid{padding-bottom:72px}}
      @media(prefers-reduced-motion:reduce){.pixie-breath{animation:none}}
    `;
    doc.head.appendChild(style);
    const icons=doc.querySelector('.icon-grid');
    const icon=doc.createElement('div');
    icon.className='desk-icon'; icon.setAttribute('role','button'); icon.tabIndex=0;
    icon.setAttribute('aria-label','Open PIXIE Control Room');
    icon.innerHTML='<div class="icon-face" style="background:rgba(83,204,255,.08);border-color:rgba(83,204,255,.28)">◉</div><div class="icon-label">Control<br>Room</div>';
    icon.addEventListener('dblclick',()=>frame.contentWindow.openWin('control'));
    icon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();frame.contentWindow.openWin('control')}});
    icons?.appendChild(icon);
    const win=doc.createElement('div');
    win.className='window w-mint'; win.id='win-control';
    win.style.cssText='left:7vw;top:5vh;width:86vw;display:none';
    win.setAttribute('role','dialog'); win.setAttribute('aria-label','PIXIE Control Room');
    win.innerHTML='<div class="win-bar"><div class="win-dots" aria-hidden="true"><div class="wdot wd-close" id="control-close"></div><div class="wdot wd-min"></div><div class="wdot wd-max"></div></div><div class="win-title">PIXIE // CONTROL ROOM</div></div><div class="win-body"><iframe src="control-room.html" title="PIXIE Control Room module"></iframe></div>';
    doc.querySelector('.taskbar')?.before(win);
    win.querySelector('#control-close').addEventListener('click',()=>frame.contentWindow.closeWin('win-control'));
    win.querySelector('.win-bar').addEventListener('mousedown',e=>frame.contentWindow.startDrag(e,'win-control'));
    win.addEventListener('mousedown',()=>frame.contentWindow.focusWin('win-control'));
    const taskbar=doc.querySelector('.taskbar');
    const taskButton=doc.createElement('button');
    taskButton.className='tb-btn t-mint'; taskButton.id='tb-control';
    taskButton.innerHTML='<span class="pixie-breath" aria-hidden="true"></span>Control';
    taskButton.addEventListener('click',()=>frame.contentWindow.openWin('control'));
    taskbar?.querySelector('.tb-right')?.before(taskButton);
    const logo=doc.querySelector('.tb-logo');
    if(logo) logo.innerHTML='<span class="pixie-breath" aria-hidden="true"></span>PIXIE OS';
  }catch(error){console.error('[PIXIE OS] Desktop boot failed:',error)}
}
frame.addEventListener('load',bootDesktop);
if(frame.contentDocument && frame.contentDocument.readyState!=='loading') bootDesktop();
</script>
</body>
</html>
