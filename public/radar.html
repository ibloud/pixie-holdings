<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PIXIE OS desktop — consent-first ecosystem control center from Loptr Lab.">
<title>PIXIE OS — Desktop</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#080b09;overflow:hidden}
#pixie-core{display:block;width:100%;height:100%;border:0;background:#080b09}
</style>
</head>
<body>
<iframe id="pixie-core" src="radar-core.html" title="PIXIE OS Desktop"></iframe>
<script>
const frame=document.getElementById('pixie-core');
const pixieParams = new URLSearchParams(window.location.search);
const coreQuery = window.location.search || '';
frame.src = 'radar-core.html' + (coreQuery ? coreQuery + '&shell=1' : '?shell=1');
function bootDesktop(){
  try{
    const doc=frame.contentDocument;
    if(!doc || doc.getElementById('win-control')) return;
    const style=doc.createElement('style');
    style.textContent=`
      @keyframes pixieBreathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(217,138,169,.25))}50%{transform:scale(1.08);filter:drop-shadow(0 0 12px rgba(217,138,169,.7))}}
      .pixie-breath{animation:pixieBreathe 3.2s ease-in-out infinite;transform-origin:center}
      .taskbar{position:fixed!important;left:0;right:0;bottom:0!important;z-index:200!important}
      #win-control{height:min(76vh,720px)}
      #win-control .win-body{padding:0;overflow:hidden;flex:1}
      #win-control iframe{display:block;width:100%;height:100%;border:0;background:#061015}
      #win-care{height:min(82vh,780px)}
      #win-care .win-body{padding:0;overflow:hidden;flex:1}
      #win-care iframe{display:block;width:100%;height:100%;border:0;background:#faf7f2}
      @media(max-width:760px){#win-control,#win-care{left:2vw!important;top:2vh!important;width:96vw!important;height:86vh!important}.icon-grid{padding-bottom:72px}}
      .wdot:focus-visible{outline:2px solid currentColor;outline-offset:3px}
      @media(prefers-reduced-motion:reduce){.pixie-breath{animation:none}}
    `;
    doc.head.appendChild(style);
    const icons=doc.querySelector('.icon-grid');
    const icon=doc.createElement('div');
    icon.className='desk-icon'; icon.setAttribute('role','button'); icon.tabIndex=0;
    icon.setAttribute('aria-label','Open PIXIE Control Room');
    icon.innerHTML='<div class="icon-face" style="background:rgba(83,204,255,.08);border-color:rgba(83,204,255,.28)">◉</div><div class="icon-label">Control<br>Room</div>';
    const openControlRoom = () => frame.contentWindow.openWin('control');

    // Made Sick is a persistent PIXIE OS application, not a dashboard replacing the host site.
    if (!doc.getElementById('icon-made-sick')) {
      const madeSickIcon=doc.createElement('div');
      madeSickIcon.className='desk-icon';
      madeSickIcon.id='icon-made-sick';
      madeSickIcon.setAttribute('role','button');
      madeSickIcon.tabIndex=0;
      madeSickIcon.setAttribute('aria-label','Open Made Sick');
      madeSickIcon.innerHTML='<div class="icon-face" style="background:rgba(255,68,68,.08);border-color:rgba(255,68,68,.32);color:#ff6b62">MS</div><div class="icon-label">Made<br>Sick</div>';
      const openMadeSick=()=>{
        // Made Sick stays inside PIXIE OS. The canonical join page is the iframe content;
        // never navigate the host desktop away from the radar.
        frame.contentWindow.openWin?.('made-sick');
      };
      madeSickIcon.addEventListener('click',openMadeSick);
      madeSickIcon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMadeSick()}});
      icons?.appendChild(madeSickIcon);
    }
    icon.addEventListener('click', openControlRoom);
    icon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openControlRoom()}});
    icons?.appendChild(icon);

    if (!doc.getElementById('icon-made-sick-care')) {
      const careIcon=doc.createElement('div');
      careIcon.className='desk-icon'; careIcon.id='icon-made-sick-care';
      careIcon.setAttribute('role','button'); careIcon.tabIndex=0;
      careIcon.setAttribute('aria-label','Open Made Sick care cue');
      careIcon.innerHTML='<div class="icon-face" style="background:rgba(255,107,98,.1);border-color:rgba(255,107,98,.4);color:#ff6b62">♥</div><div class="icon-label">Care<br>Cue</div>';
      const openCare=()=>frame.contentWindow.openWin?.('care');
      careIcon.addEventListener('click',openCare);
      careIcon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCare()}});
      icons?.appendChild(careIcon);
    }
    const madeSickWin=doc.createElement('div');
    madeSickWin.className='window w-pink'; madeSickWin.id='win-made-sick';
    madeSickWin.style.cssText='left:8vw;top:4vh;width:84vw;height:min(82vh,780px);display:none';
    madeSickWin.setAttribute('role','dialog'); madeSickWin.setAttribute('aria-label','Made Sick');
    madeSickWin.innerHTML='<div class="win-bar"><div class="win-dots"><div class="wdot wd-close"></div><div class="wdot wd-min"></div><div class="wdot wd-max"></div></div><div class="win-title">PIXIE // MADE SICK</div></div><div class="win-body" style="padding:0;overflow:hidden;flex:1"><iframe src="https://made-sick.org/join.html" title="Made Sick" style="display:block;width:100%;height:100%;border:0;background:#fff"></iframe></div>';
    doc.querySelector('.taskbar')?.before(madeSickWin);
    frame.contentWindow.wireWindow?.('win-made-sick');
    const madeSickTask=doc.createElement('button');
    madeSickTask.className='tb-btn t-pink'; madeSickTask.id='tb-made-sick'; madeSickTask.textContent='Made Sick';
    madeSickTask.addEventListener('click',()=>frame.contentWindow.openWin('made-sick'));
    doc.querySelector('.taskbar .tb-right')?.before(madeSickTask);

    const win=doc.createElement('div');
    win.className='window w-mint'; win.id='win-control';
    win.style.cssText='left:7vw;top:5vh;width:86vw;display:none';
    win.setAttribute('role','dialog'); win.setAttribute('aria-label','PIXIE Control Room');
    win.innerHTML='<div class="win-bar"><div class="win-dots"><div class="wdot wd-close"></div><div class="wdot wd-min"></div><div class="wdot wd-max"></div></div><div class="win-title">PIXIE // CONTROL ROOM</div></div><div class="win-body"><iframe src="control-room.html" title="PIXIE Control Room module"></iframe></div>';
    doc.querySelector('.taskbar')?.before(win);
    frame.contentWindow.wireWindow?.('win-control');
    const taskbar=doc.querySelector('.taskbar');
    const taskButton=doc.createElement('button');
    taskButton.className='tb-btn t-mint'; taskButton.id='tb-control';
    taskButton.textContent='Control';
    taskButton.addEventListener('click',()=>frame.contentWindow.openWin('control'));
    taskbar?.querySelector('.tb-right')?.before(taskButton);

    const careWin=doc.createElement('div');
    careWin.className='window w-pink'; careWin.id='win-care';
    careWin.style.cssText='left:10vw;top:4vh;width:80vw;display:none';
    careWin.setAttribute('role','dialog'); careWin.setAttribute('aria-label','Made Sick PIXIE care cue');
    careWin.innerHTML='<div class="win-bar"><div class="win-dots"><div class="wdot wd-close"></div><div class="wdot wd-min"></div><div class="wdot wd-max"></div></div><div class="win-title">PIXIE // MADE SICK CARE</div></div><div class="win-body"><iframe src="https://made-sick.org/pixie-care.html" title="Made Sick PIXIE care workspace"></iframe></div>';
    doc.querySelector('.taskbar')?.before(careWin);
    frame.contentWindow.wireWindow?.('win-care');
    const careTask=doc.createElement('button');
    careTask.className='tb-btn t-pink'; careTask.id='tb-care'; careTask.textContent='Care';
    careTask.addEventListener('click',()=>frame.contentWindow.openWin('care'));
    taskbar?.querySelector('.tb-right')?.before(careTask);
    const pixieIcon=doc.querySelector('[aria-label="Open PIXIE Agent"] .icon-face');
    pixieIcon?.classList.add('pixie-breath');
  }catch(error){console.error('[PIXIE OS] Desktop boot failed:',error)}
}
frame.addEventListener('load',bootDesktop);
window.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !e.defaultPrevented && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
    window.parent.postMessage({type:'pixie:close-os'},window.location.origin);
  }
});
window.addEventListener('message',e=>{
  if(e.origin!==window.location.origin)return;
  if(e.data?.type==='pixie:focus-window' && e.data.name) frame.contentWindow.openWin?.(e.data.name);
});
function routeMadeSickHandoff(){
  const role=pixieParams.get('role');
  const tool=pixieParams.get('tool');
  if(tool==='care'){
    setTimeout(()=>frame.contentWindow.openWin?.('care'),250);
  }else if(role==='admin'){
    setTimeout(()=>frame.contentWindow.openWin?.('control'),250);
  }else if(role==='participant'){
    setTimeout(()=>frame.contentWindow.openWin?.('made-sick'),250);
  }
}
frame.addEventListener('load',routeMadeSickHandoff);
if(frame.contentDocument && frame.contentDocument.readyState!=='loading') bootDesktop();
</script>
</body>
</html>
